services:
  hassio-mcp:
    build:
      context: ./hassio_mcp
      target: compose
    restart: unless-stopped
    env_file: .env.local
    volumes:
      - mcp-data:/data
      # Optional, only for editing allowlisted YAML package files:
      # - /absolute/path/to/ha-config:/homeassistant:rw
      # Blueprint reads/review need the same connected HA config; read-only is sufficient:
      # - /absolute/path/to/ha-config:/homeassistant:ro
      # Or mount only ESPHome configs and set ESPHOME_CONFIG_DIR=/esphome-config:
      # - /absolute/path/to/esphome:/esphome-config:ro
      # Optional HTTPS client certificates:
      # - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /home/mcp:uid=10001,gid=10001,mode=700,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # No host ports: the tunnel connects outbound and reaches MCP over stdio.
  esphome-worker:
    profiles: [esphome]
    build: ./esphome_worker
    user: "0:10001"
    restart: unless-stopped
    environment:
      ESPHOME_WORKER_TOKEN: ${ESPHOME_WORKER_TOKEN:-}
      ALLOW_ESPHOME_INSTALL: ${ALLOW_ESPHOME_INSTALL:-false}
    volumes:
      - esphome-worker-data:/data/worker
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    cpus: 2
    pids_limit: 128
    # Private service port 6053 only; no HA configuration or Docker socket mounts.
volumes:
  mcp-data:
  esphome-worker-data:

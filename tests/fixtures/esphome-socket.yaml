esphome:
  name: socket-1
  friendly_name: socket_1

esp8266:
  board: esp01_1m

# Enable Home Assistant API
api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret api_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Socket-1 Fallback Hotspot"
    password: !secret fallback_password

web_server:
  port: 80
  auth:
    username: esp
    password: !secret web_server_password

uart:
  id: uart_bus
  tx_pin: TX
  rx_pin: RX
  baud_rate: 4800
  stop_bits: 1

logger:
  baud_rate: 0
  esp8266_store_log_strings_in_flash: false
  # level: VERY_VERBOSE
  #  level: INFO
  logs:
    api.service: INFO
    uart_esp8266: INFO
    sensor: INFO

status_led:
  pin:
    number: GPIO4
    inverted: True

switch:
  platform: gpio
  id: "pwr"
  pin: GPIO5
  restore_mode: ALWAYS_OFF
  name: "${prefix} power switch"
  on_turn_on:
    - logger.log: "Power on"
  on_turn_off:
    - logger.log: "Power off"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13
      mode: INPUT_PULLUP
      inverted: True
    id: "powerbutton"
    on_click:
      then:
        - switch.toggle: pwr

sensor:
  - platform: bl0940
    uart_id: uart_bus
    voltage:
      name: "${prefix} voltage"
    current:
      name: "${prefix} current"
    power:
      name: "${prefix} power"
    energy:
      name: "${prefix} energy"
    internal_temperature:
      name: "${prefix} internal temperature"
    update_interval: 60s

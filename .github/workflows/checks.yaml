name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            hassio_mcp/requirements.lock
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt -e ./hassio_mcp
      - run: python -m ruff check hassio_mcp/src tests scripts
      - run: python -m ruff format --check hassio_mcp/src tests scripts
      - run: python -m pytest -q
      - run: python scripts/package_addon.py
      - run: docker build --target compose -t hassio-mcp:ci hassio_mcp
      - run: docker build -t hassio-mcp-haos:ci hassio_mcp
      - run: python scripts/smoke_container.py hassio-mcp:ci hassio-mcp-haos:ci

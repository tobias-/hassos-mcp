name: Home Assistant Private MCP
version: "0.13.0"
slug: hassio_mcp
url: https://github.com/tobias-/hassos-mcp
description: Private ChatGPT access to states, history, traces and reviewed automation edits
arch: [amd64, aarch64]
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_title: MCP setup guide
panel_icon: mdi:help-circle-outline
map:
  - type: homeassistant_config
    read_only: false
options:
  tunnel_id: ""
  openai_api_key: ""
  ha_url: "http://homeassistant:8123"
  ha_token: ""
  allow_automation_writes: false
  allow_blueprint_writes: false
  allow_management_writes: false
  yaml_files: []
  config_files: []
  esphome_config_dir: ""
  influx_url: ""
  influx_version: "1"
  influx_database: homeassistant
  influx_user: ""
  influx_password: ""
  influx_token: ""
  influx_org: ""
  influx_bucket: homeassistant
schema:
  tunnel_id: str
  openai_api_key: password
  ha_url: str
  ha_token: password
  allow_automation_writes: bool
  allow_blueprint_writes: bool
  allow_management_writes: bool
  yaml_files:
    - str
  config_files:
    - str
  esphome_config_dir: str
  influx_url: str
  influx_version: list(1|2)
  influx_database: str
  influx_user: str
  influx_password: password
  influx_token: password
  influx_org: str
  influx_bucket: str

name: Home Assistant Private MCP
version: "0.19.0"
slug: hassio_mcp
url: https://github.com/tobias-/hassos-mcp
description: Private ChatGPT access to states, history, traces and reviewed automation edits
arch: [amd64, aarch64]
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
hassio_role: homeassistant
ingress: true
ingress_port: 8099
panel_title: MCP setup guide
panel_icon: mdi:help-circle-outline
map:
  - type: homeassistant_config
    read_only: false
options:
  tunnel_id: ""
  openai_api_key: ""
  ha_url: "http://homeassistant:8123"
  ha_token: ""
  allow_automation_writes: false
  allow_blueprint_writes: false
  allow_management_writes: false
  yaml_files: []
  config_files: []
  esphome_config_dir: ""
  esphome_worker_url: ""
  esphome_worker_token: ""
  allow_esphome_config_writes: false
  allow_esphome_install: false
  influx_url: ""
  influx_version: "1"
  influx_database: homeassistant
  influx_user: ""
  influx_password: ""
  influx_token: ""
  influx_org: ""
  influx_bucket: homeassistant
  postgres_host: ""
  postgres_port: 5432
  postgres_database: ""
  postgres_user: ""
  postgres_password: ""
  postgres_admin_user: ""
  postgres_admin_password: ""
  postgres_sslmode: require
  postgres_tables: []
  allow_zha_debug: false
  allow_postgres_writes: false
schema:
  tunnel_id: str
  openai_api_key: password
  ha_url: str
  ha_token: password
  allow_automation_writes: bool
  allow_blueprint_writes: bool
  allow_management_writes: bool
  yaml_files:
    - str
  config_files:
    - str
  esphome_config_dir: str
  esphome_worker_url: str
  esphome_worker_token: password
  allow_esphome_config_writes: bool
  allow_esphome_install: bool
  influx_url: str
  influx_version: list(1|2)
  influx_database: str
  influx_user: str
  influx_password: password
  influx_token: password
  influx_org: str
  influx_bucket: str
  postgres_host: str
  postgres_port: port
  postgres_database: str
  postgres_user: str
  postgres_password: password
  postgres_admin_user: str
  postgres_admin_password: password
  postgres_sslmode: list(disable|require|verify-full)
  postgres_tables:
    - str
  allow_zha_debug: bool
  allow_postgres_writes: bool
